name: HL Leaderboard Scanner

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "تعداد نتایج ارسالی به تلگرام"
        required: false
        default: "100"
      min_win_rate:
        description: "حداقل وین ریت (0.40 = 40%)"
        required: false
        default: "0.40"
      min_lbank_share:
        description: "حداقل سهم ارزهای البانک (0.90 = 90%)"
        required: false
        default: "0.90"
      chunks:
        description: "تعداد بخش‌های موازی (پیشنهاد: 8)"
        required: false
        default: "8"

concurrency:
  group: hl-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests ccxt

      - name: Run scanner (chunk ${{ matrix.chunk }})
        env:
          CHUNK_INDEX:         ${{ matrix.chunk }}
          CHUNK_TOTAL:         "8"
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_WIN_RATE_ENV:    ${{ github.event.inputs.min_win_rate }}
          MIN_LBANK_SHARE_ENV: ${{ github.event.inputs.min_lbank_share }}
        run: python bot.py

      - name: Upload chunk result
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.chunk }}
          path: results_${{ matrix.chunk }}.json
          retention-days: 1

  merge:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download all chunk results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: results-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la artifacts/

      - name: Merge and send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N:              ${{ github.event.inputs.top_n }}
        working-directory: artifacts
        run: python ../bot_merge.py
