name: HL Leaderboard Scanner

on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "تعداد نتایج ارسالی به تلگرام"
        required: false
        default: "100"
      min_win_rate:
        description: "حداقل وین ریت (0.40 = 40%)"
        required: false
        default: "0.40"
      min_lbank_share:
        description: "حداقل سهم ارزهای البانک (0.90 = 90%)"
        required: false
        default: "0.90"

concurrency:
  group: hl-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests ccxt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N:               ${{ github.event.inputs.top_n }}
          MIN_WIN_RATE_ENV:    ${{ github.event.inputs.min_win_rate }}
          MIN_LBANK_SHARE_ENV: ${{ github.event.inputs.min_lbank_share }}
        run: python bot.py
