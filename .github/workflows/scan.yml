name: Crypto Shooting Star Scanner

on:
  # فقط اجرای دستی از تب Actions
  workflow_dispatch:

# اجازه‌ی خواندن محتوای ریپو
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ۱) دریافت کد ریپو
      - name: Checkout repository
        uses: actions/checkout@v4

      # ۲) نصب پایتون
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ۳) نصب کتابخانه‌ها
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ۴) اجرای اسکنر
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
